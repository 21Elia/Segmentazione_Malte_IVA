# Second campaign (v2) - Exp2: fine-tuning from the v2 Baseline, geometric + synchronous photometric augmentation.
DEVICE          : cuda
SAVE_DIR        : 'output/MMSFormer'
GPUs            : 1
GPU_IDs         : [0]
USE_WANDB       : false
WANDB_NAME      : 'MMSF-V2-EXP2'

MODEL:
  NAME          : MMSFormer
  BACKBONE      : MMSFormer-B3
  PRETRAINED    : 'output/MMSFormer/MMSF-V2-BASELINE/<best_checkpoint>.pth'   # fill in: best v2 Baseline
  RESUME        : ''

DATASET:
  NAME          : MORTARS
  ROOT          : 'data/mortars_v2'       # labels regenerated with the fixed preprocess.py (black mask pixels = class)
  IGNORE_LABEL  : 3                       # alignment padding
  MODALS        : ['paralleli', 'incrociati']
  NUM_CLASSES   : 2                       # 0 = binder (porosity merged), 1 = aggregates
  NORMALIZATION : imagenet                # same for training, validation and inference (D1)

TRAIN:
  IMAGE_SIZE    : [512, 512]
  BATCH_SIZE    : 4
  EPOCHS        : 50
  EVAL_START    : 0
  EVAL_INTERVAL : 1
  AMP           : false                   # FP32: the old AMP baseline collapsed for several epochs
  DDP           : false
  WEIGHTED_RANDOM_SAMPLER : false
  SEED          : 3407                    # override with --seed for a second run
  # Exp2 v2: geometric + strong synchronous photometric augmentation (reference to beat for Exp4B)
  AUGMENTATION  :
    GEOMETRIC:
      HFLIP: 0.5
      VFLIP: 0.5
      ROT90: 0.5
      ROTATE: {DEGREES: 15, P: 0.2}
      RESIZED_CROP: {SCALE: [0.5, 2.0]}
    PHOTOMETRIC:
      # First-campaign Exp2 photometric augmentation, same random parameters on NP and NX
      SYNC: true
      SHARED:
        - {OP: jitter, BRIGHTNESS: [0.7, 1.3], CONTRAST: [0.7, 1.3], SATURATION: [0.7, 1.3], HUE: [-0.05, 0.05], P: 0.5}
        - {OP: gamma, RANGE: [0.7, 1.5], P: 0.3}
        - {OP: noise, SIGMA: [0, 15], P: 0.3}
        - {OP: blur, SIGMA: [0.1, 2.0], KERNEL: 3, P: 0.2}

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false
  CLASS_WEIGHTS : [1.0, 8.0, 2.5]

OPTIMIZER:
  NAME          : adamw
  LR            : 3e-05
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 5
  WARMUP_RATIO  : 0.1

EVAL:
  # Fill in after training: the best checkpoint saved in output/MMSFormer/MMSF-V2-EXP2/
  MODEL_PATH    : 'output/MMSFormer/MMSF-V2-EXP2/<best_checkpoint>.pth'
  IMAGE_SIZE    : [512, 512]
  BATCH_SIZE    : 1
  SAVE_PREDICTIONS : true
  ERROR_THRESHOLD  : -1.0
  SAVE_CONFUSION   : true
  VIS_SAVE_DIR     : 'data/results_v2_exp2'
  CONFUSION_DIR    : 'data/confusion_v2_exp2'
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

TEST:
  MODEL_PATH    : 'output/MMSFormer/MMSF-V2-EXP2/<best_checkpoint>.pth'
  IMAGE_SIZE    : [512, 512]
  VIS_SAVE_DIR  : 'output/inference_v2/v2_exp2'
  FILE          : 'data/mortars_v2'
  OVERLAY       : true
