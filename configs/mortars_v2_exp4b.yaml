# Second campaign (v2) - Exp4B: fine-tuning from the v2 Baseline, geometric + data-driven asymmetric
# photometric augmentation. Ranges from output/domain_shift_analysis_v2/exp4b_parameters.csv
# (tools/quantify_domain_shift.py): fitted values per target, identity included, extremes widened by 5%.
# Deliberate deviations from the 5% rule (see analisi_domain_shift_v2_e_parametri_exp4b, 12.6):
#   NP gamma lower end 0.50 instead of 0.34 (0.34 comes from ARCHEO_02 alone, which has no ground truth)
#   NP saturation capped at 1.8 (rule 2.9: driven by the red content of 1_SCALA, already in sec1-3)
#   NX saturation capped at 1.4 (rule 1.8: driven by the interference colours of ARCHEO_02, content)
#   NX blur lower end 0.35 (a Gaussian blur below ~0.35 px leaves 8-bit images unchanged)
#   no hue rotation and no colour temperature (target hue within the warm Source sections; white point neutral)
DEVICE          : cuda
SAVE_DIR        : 'output/MMSFormer'
GPUs            : 1
GPU_IDs         : [0]
USE_WANDB       : false
WANDB_NAME      : 'MMSF-V2-EXP4B'

MODEL:
  NAME          : MMSFormer
  BACKBONE      : MMSFormer-B3
  PRETRAINED    : 'output/MMSFormer/MMSF-V2-BASELINE/MMSFormer_MMSFormer-B3_MORTARS_epoch100_80.03.pth'   # best v2 Baseline (val 80.03, test 78.62)
  RESUME        : ''

DATASET:
  NAME          : MORTARS
  ROOT          : 'data/mortars_v2'       # labels regenerated with the fixed preprocess.py (black mask pixels = class)
  IGNORE_LABEL  : 3                       # alignment padding
  MODALS        : ['paralleli', 'incrociati']
  NUM_CLASSES   : 2                       # 0 = binder (porosity merged), 1 = aggregates
  NORMALIZATION : imagenet                # same for training, validation and inference (D1)

TRAIN:
  IMAGE_SIZE    : [512, 512]
  BATCH_SIZE    : 4
  EPOCHS        : 50
  EVAL_START    : 0
  EVAL_INTERVAL : 1
  AMP           : false                   # FP32: the old AMP baseline collapsed for several epochs
  DDP           : false
  WEIGHTED_RANDOM_SAMPLER : false
  SEED          : 3407                    # override with --seed for a second run
  # Exp4B: same geometric augmentation as Exp1/Exp2 v2, photometric parameters drawn independently for NP and NX
  AUGMENTATION  :
    GEOMETRIC:
      HFLIP: 0.5
      VFLIP: 0.5
      ROT90: 0.5
      ROTATE: {DEGREES: 15, P: 0.2}
      RESIZED_CROP: {SCALE: [0.5, 2.0]}
    PHOTOMETRIC:
      SYNC: false
      paralleli:
        - {OP: gamma,      RANGE: [0.50, 2.34], LOG: true, P: 0.6}   # fitted 2.23 / 1.73 / 0.36
        - {OP: contrast,   RANGE: [0.63, 1.13], LOG: true, P: 0.5}   # fitted 0.77 / 0.67 / 1.07
        - {OP: saturation, RANGE: [1.00, 1.80], LOG: true, P: 0.5}   # fitted 2.76 / 1.51 / 1.68, capped
        - {OP: noise,      SIGMA: [0.0, 3.0],              P: 0.3}   # equivalent 2.79 / 1.12 / 1.53
      incrociati:
        - {OP: gamma,      RANGE: [1.00, 1.35], LOG: true, P: 0.6}   # fitted 1.19 / 1.18 / 1.28
        - {OP: contrast,   RANGE: [0.63, 1.00], LOG: true, P: 0.5}   # fitted 0.90 / 0.91 / 0.67
        - {OP: saturation, RANGE: [0.65, 1.40], LOG: true, P: 0.5}   # fitted 1.05 / 0.69 / 1.71, capped
        - {OP: blur,       SIGMA: [0.35, 0.55],            P: 0.25}  # equivalent 0 / 0 / 0.52
        - {OP: noise,      SIGMA: [0.0, 4.7],              P: 0.3}   # equivalent 4.44 / 3.34 / 0

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false
  CLASS_WEIGHTS : [1.0, 8.0, 2.5]

OPTIMIZER:
  NAME          : adamw
  LR            : 0.00003         # 3e-5 written in decimal: PyYAML reads '3e-05' as a string
  WEIGHT_DECAY  : 0.01

SCHEDULER:
  NAME          : warmuppolylr
  POWER         : 0.9
  WARMUP        : 5
  WARMUP_RATIO  : 0.1

EVAL:
  # Fill in after training: the best checkpoint saved in output/MMSFormer/MMSF-V2-EXP4B/
  MODEL_PATH    : 'output/MMSFormer/MMSF-V2-EXP4B/MMSFormer_MMSFormer-B3_MORTARS_epoch44_78.54.pth'
  IMAGE_SIZE    : [512, 512]
  BATCH_SIZE    : 1
  SAVE_PREDICTIONS : true
  ERROR_THRESHOLD  : -1.0
  SAVE_CONFUSION   : true
  VIS_SAVE_DIR     : 'data/results_v2_exp4b'
  CONFUSION_DIR    : 'data/confusion_v2_exp4b'
  MSF:
    ENABLE      : false
    FLIP        : true
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]

TEST:
  MODEL_PATH    : 'output/MMSFormer/MMSF-V2-EXP4B/MMSFormer_MMSFormer-B3_MORTARS_epoch44_78.54.pth'
  IMAGE_SIZE    : [512, 512]
  VIS_SAVE_DIR  : 'output/inference_v2/v2_exp4b'
  FILE          : 'data/mortars_v2'
  OVERLAY       : true
