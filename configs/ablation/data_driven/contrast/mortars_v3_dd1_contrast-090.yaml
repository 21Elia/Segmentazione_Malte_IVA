# Ablation - data-driven pipeline, single operation: contrast at P_op = 0.9 (NP and NX), every other op at P_op = 0.
# Same ranges as the full data-driven pipeline (configs/ablation/data_driven/full/mortars_v3_dd-060.yaml).
# A pair is selected for photometric augmentation with P_IMAGE = 0.8; contrast then fires with P_op = 0.9.
# Run folder: <SAVE_DIR>/MMSF-V3-DD1-CONTRAST-090-p080[-seedN].

DEVICE          : cuda
SAVE_DIR        : 'output/campaign3/MMSFormer'   # run folders, one per config and seed
GPUs            : 1
GPU_IDs         : [0]
USE_WANDB       : false
WANDB_NAME      : 'MMSF-V3-DD1-CONTRAST-090'

MODEL:
  NAME          : MMSFormer
  BACKBONE      : MMSFormer-B3
  PRETRAINED    : 'checkpoints/pretrained/segformer/mit_b3.pth'   # ImageNet backbone only
  RESUME        : ''

DATASET:
  NAME          : MORTARS
  ROOT          : 'data/mortars'          # historical sections, from tools/preprocessing/preprocess.py
  IGNORE_LABEL  : 3                       # alignment padding
  MODALS        : ['paralleli', 'incrociati']
  NUM_CLASSES   : 2                       # 0 = binder (porosity merged), 1 = aggregates
  NORMALIZATION : imagenet                # same for training, validation and inference

TRAIN:
  IMAGE_SIZE    : [512, 512]
  BATCH_SIZE    : 4
  EPOCHS        : 300                     # upper bound: early stopping decides when to stop
  EVAL_START    : 0
  EVAL_INTERVAL : 1                       # the plateau and early stopping counters count validations
  AMP           : false                   # FP32 (mixed precision produced NaN losses)
  DDP           : false
  WEIGHTED_RANDOM_SAMPLER : false
  SEED          : 3407                    # override with --seed for a second run
  EARLY_STOPPING:
    PATIENCE    : 30                      # validations without a gain > MIN_DELTA before stopping
    MIN_DELTA   : 0.1                     # mIoU points
  VAL_SMOOTHING : 5                       # plateau and early stopping on the val mIoU of the last 5 epochs (best checkpoint on the raw value)
  VAL_SMOOTHING_MODE : median            # moving median: up to 2 collapsed epochs in the window are ignored
  AUGMENTATION  :
    GEOMETRIC:
      HFLIP: 0.5
      VFLIP: 0.5
      ROT90: 0.5
      ROTATE: {DEGREES: 15, P: 0.2}
      RESIZED_CROP: {SCALE: [0.5, 2.0]}
    PHOTOMETRIC:
      P_IMAGE: 0.8                        # probability that a pair gets photometric augmentation
      AT_LEAST_ONE: false                 # each op fires with P_IMAGE * P; all P = 0 would be the Baseline
      SYNC: false                         # parameters drawn independently for NP and NX
      paralleli:                          # every op at 0, contrast at 0.9
        - {OP: gamma,      RANGE: [0.50, 2.34], LOG: true, P: 0.0}
        - {OP: contrast,   RANGE: [0.63, 1.13], LOG: true, P: 0.9}
        - {OP: saturation, RANGE: [1.00, 1.80], LOG: true, P: 0.0}
        - {OP: noise,      SIGMA: [0.0, 3.0],              P: 0.0}
      incrociati:
        - {OP: gamma,      RANGE: [1.00, 1.35], LOG: true, P: 0.0}
        - {OP: contrast,   RANGE: [0.63, 1.00], LOG: true, P: 0.9}
        - {OP: saturation, RANGE: [0.65, 1.40], LOG: true, P: 0.0}
        - {OP: blur,       SIGMA: [0.35, 0.55],            P: 0.0}
        - {OP: noise,      SIGMA: [0.0, 4.7],              P: 0.0}

LOSS:
  NAME          : OhemCrossEntropy
  CLS_WEIGHTS   : false
  CLASS_WEIGHTS : [1.0, 8.0, 2.5]

OPTIMIZER:
  NAME          : adamw
  LR            : 0.0001
  WEIGHT_DECAY  : 0.1

SCHEDULER:
  NAME          : warmupplateau           # linear warmup per iteration, then ReduceLROnPlateau on the val mIoU
  WARMUP        : 10                      # epochs, from WARMUP_RATIO * LR to LR
  WARMUP_RATIO  : 0.1
  FACTOR        : 0.5                     # LR multiplier at each plateau
  PATIENCE      : 8                       # validations without a gain > THRESHOLD before reducing the LR
  THRESHOLD     : 0.1                     # mIoU points (absolute)
  MIN_LR        : 0.000001

EVAL:
  # checkpoint to evaluate: pass --run-dir (best checkpoint of a run folder) or --model-path
  MODEL_PATH    : ''
  IMAGE_SIZE    : [512, 512]
  BATCH_SIZE    : 1
  SAVE_PREDICTIONS : true
  ERROR_THRESHOLD  : -1.0
  SAVE_CONFUSION   : true
  VIS_SAVE_DIR     : 'output/campaign3/results/v3_dd1_contrast_090'
  CONFUSION_DIR    : 'output/campaign3/confusion/v3_dd1_contrast_090'
